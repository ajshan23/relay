<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  const v = (n) => `var(--${n})`;
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Figtree', 'system-ui', 'sans-serif'], display: ['"Bricolage Grotesque"', 'Figtree', 'sans-serif'] },
        colors: {
          canvas: v('canvas'), side: v('side'), 'side-ink': v('side-ink'), 'side-muted': v('side-muted'), 'side-active': v('side-active'), 'side-line': v('side-line'), surface: v('surface'), raised: v('raised'), line: v('line'),
          ink: v('ink'), muted: v('muted'),
          primary: v('primary'), 'primary-ink': v('primary-ink'), 'primary-soft': v('primary-soft'),
          ai: v('ai'), 'ai-ink': v('ai-ink'), 'ai-strong': v('ai-strong'),
          good: v('good'), 'good-soft': v('good-soft'), danger: v('danger'), 'danger-soft': v('danger-soft'),
        },
        borderRadius: { card: '14px', ctl: '10px' },
      },
    },
  };
</script>
<style>
  /* Theme "Tide": a deep-water sidebar, bright mist workspace, petrol for people and actions, apricot for anything the AI did. */
  :root {
    --canvas: #F3F6F7; --surface: #FFFFFF; --raised: #EAF0F2; --line: #D9E2E6;
    --ink: #0E2029; --muted: #566B75;
    --primary: #0B6375; --primary-ink: #FFFFFF; --primary-soft: #D8ECF0;
    --ai: #FFEFDA; --ai-ink: #6B3A05; --ai-strong: #FFAE5C;
    --good: #18794E; --good-soft: #D9F0E4; --danger: #B4233C; --danger-soft: #FBE3E7;
    --side: #0E2730; --side-ink: #F1F6F7; --side-muted: #9DB3BB; --side-active: #1C4350; --side-line: #1F3C47;
    --shadow: 0 1px 2px rgba(14, 32, 41, .05), 0 10px 28px -14px rgba(14, 32, 41, .18);
  }
  :root[data-theme="dark"] {
    --canvas: #0B151A; --surface: #121F26; --raised: #1A2C34; --line: #24383F;
    --ink: #E8F0F2; --muted: #8FA3AB;
    --primary: #5CC8D8; --primary-ink: #05252C; --primary-soft: #143842;
    --ai: #33260F; --ai-ink: #FFCF99; --ai-strong: #FFAE5C;
    --good: #5FD39A; --good-soft: #123425; --danger: #FF8A9B; --danger-soft: #3D1620;
    --side: #070E12; --side-ink: #E8F0F2; --side-muted: #7F959D; --side-active: #16282F; --side-line: #16252B;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px -14px rgba(0, 0, 0, .6);
  }
  body { background: var(--canvas); color: var(--ink); }
  ::placeholder { color: var(--muted); opacity: 1; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
  aside[data-side] :focus-visible { outline-color: var(--ai-strong); }
  .shadow-card { box-shadow: var(--shadow); }
  .thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .thin::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
  .live { position: relative; }
  .live::after { content: ""; position: absolute; inset: 0; border-radius: 99px; background: inherit; }
  @media (prefers-reduced-motion: no-preference) {
    .panel-in { animation: slide .18s ease-out; }
    .rise { animation: rise .22s ease-out both; }
    .live::after { animation: ping 1.8s ease-out infinite; }
    .dot { animation: blink 1.2s infinite both; }
    .dot:nth-child(2) { animation-delay: .15s; } .dot:nth-child(3) { animation-delay: .3s; }
  }
  @keyframes slide { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(2.6); opacity: 0; } }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
</style>
</head>
<body class="font-sans antialiased">
<div id="app" class="h-screen flex overflow-hidden"></div>

<script>
/* ------------------------------------------------------------------ state */
const state = {
  page: (location.hash || '#assistant').slice(1),
  thread: null, panel: true, details: false, customer: null, agentTab: 'Teach', menu: false,
  palette: false, toast: '', chat: 'Daniel Okafor', extra: {}, done: [], pending: '', draftUsed: false, sent: false,
  needs: [0, 1, 2], branch: 'Marina', theme: localStorageGet('relay-theme') || 'light',
};
function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, val) { try { localStorage.setItem(k, val); } catch { /* private mode */ } }

/* ------------------------------------------------------------------- data */
const chats = [
  { name: 'Daniel Okafor', preview: 'I was charged twice for the whitening. Can I get a refund?', time: '4 min', ch: 'Instagram', who: 'Needs a person', unread: 1 },
  { name: 'Asha Menon', preview: 'Saturday 11 works. Do I need to bring my old reports?', time: '2 min', ch: 'WhatsApp', who: 'Mira', unread: 2 },
  { name: 'Rahul Verma', preview: 'Can I move my appointment to Monday?', time: '2 hr', ch: 'WhatsApp', who: 'Mira' },
  { name: 'Website visitor', preview: 'Do you open on Sundays?', time: '1 hr', ch: 'Website', who: 'Mira' },
  { name: 'Fatima Noor', preview: 'You: Your invoice is attached. Thank you for visiting.', time: '32 min', ch: 'WhatsApp', who: 'Priya' },
  { name: 'Leila Haddad', preview: 'Thanks, see you tomorrow.', time: '3 hr', ch: 'WhatsApp', who: 'Sameer' },
  { name: 'Tom Becker', preview: 'How much is a check-up for a child?', time: '5 hr', ch: 'Instagram', who: 'Mira' },
];
const customers = [
  ['Asha Menon', 'Marina', 'WhatsApp', 'Booked', 'Sat 11:00', 'Mira'], ['Daniel Okafor', 'Marina', 'Instagram', 'Talking', 'Refund request', 'Front desk'],
  ['Rahul Verma', 'Marina', 'WhatsApp', 'Booked', 'Mon 10:30', 'Mira'], ['Fatima Noor', 'Downtown', 'WhatsApp', 'Visited', 'Invoice sent', 'Priya'],
  ['Leila Haddad', 'Marina', 'WhatsApp', 'Booked', 'Wed 4:00', 'Sameer'], ['Tom Becker', 'Downtown', 'Instagram', 'New enquiry', 'Asked a price', 'Mira'],
  ['Nora Aziz', 'Marina', 'WhatsApp', 'New enquiry', 'Asked about braces', 'Mira'], ['Omar Said', 'Downtown', 'WhatsApp', 'Booked', 'Thu 9:00', 'Mira'],
  ['Ivy Chen', 'Marina', 'Website', 'Visited', 'Asked for a review', 'Mira'],
];
const needs = [
  { icon: 'hand-helping', title: 'Daniel is asking for a refund', detail: 'Mira stopped and handed the chat to the front desk 4 minutes ago.', action: 'Open chat', go: 'inbox' },
  { icon: 'book-open', title: 'Mira couldn’t answer an insurance question', detail: '“Do you take Aetna?” was asked 3 times this week.', action: 'Teach Mira', go: 'agents' },
  { icon: 'circle-alert', title: 'WhatsApp rejected your reminder message', detail: 'It reads like marketing. A small rewording fixes it.', action: 'Fix message', go: 'campaigns' },
];
const recents = ['Winter cleaning offer', 'Why did Mira hand over 5 chats?', 'Add the Downtown branch', 'Teach Mira the price list', 'Weekly numbers for both branches'];
const nav = [['assistant', 'sparkles', 'Assistant'], ['inbox', 'message-circle', 'Inbox', 3], ['customers', 'users', 'Customers'], ['agents', 'bot', 'Agents'], ['campaigns', 'megaphone', 'Campaigns'], ['insights', 'bar-chart-3', 'Insights']];
const chIcon = { WhatsApp: 'message-circle', Instagram: 'camera', Website: 'globe' };

/* ---------------------------------------------------------------- helpers */
const ic = (n, c = 'w-4 h-4') => `<i data-lucide="${n}" class="${c} shrink-0"></i>`;
const initials = (n) => n.split(' ').map((p) => p[0]).slice(0, 2).join('').toUpperCase();
const avatar = (n, c = 'w-9 h-9 text-xs') => `<span class="${c} shrink-0 rounded-full bg-raised text-ink font-semibold inline-flex items-center justify-center">${initials(n)}</span>`;
const mira = (c = 'w-9 h-9 text-sm') => `<span class="${c} shrink-0 rounded-full bg-ai-strong text-[#4A2600] font-bold inline-flex items-center justify-center" title="Mira, AI agent">M</span>`;
const mark = (c = 'w-8 h-8') => `<span class="${c} shrink-0 rounded-[10px] bg-primary text-primary-ink inline-flex items-center justify-center">${ic('messages-square', 'w-[58%] h-[58%]')}</span>`;
const btn = (label, kind = 'quiet', attrs = '') => {
  const k = { primary: 'bg-primary text-primary-ink hover:opacity-90', quiet: 'bg-raised text-ink hover:bg-line', ghost: 'text-muted hover:bg-raised', line: 'border border-line text-ink hover:bg-raised' }[kind];
  return `<button ${attrs} class="h-9 px-3.5 rounded-ctl text-sm font-semibold whitespace-nowrap inline-flex items-center gap-2 ${k}">${label}</button>`;
};
const chip = (label, tone = 'plain') => {
  const t = { plain: 'bg-raised text-muted', ai: 'bg-ai text-ai-ink', good: 'bg-good-soft text-good', danger: 'bg-danger-soft text-danger', primary: 'bg-primary-soft text-primary' }[tone];
  return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap ${t}">${label}</span>`;
};
const whoChip = (w) => (w === 'Mira' ? chip('Mira', 'ai') : w === 'Needs a person' || w === 'Front desk' ? chip(w, 'danger') : chip(w));
const stageChip = (s) => chip(s, { Booked: 'good', Talking: 'primary', 'New enquiry': 'ai', Visited: 'plain' }[s]);
const card = (inner, extra = '') => `<div class="bg-surface border border-line rounded-card shadow-card ${extra}">${inner}</div>`;
const pageHead = (title, sub, actions = '') => `
  <header class="px-5 sm:px-8 pt-7 pb-5 flex flex-wrap items-end gap-3">
    <div class="min-w-0 flex-1"><h1 class="font-display text-[28px] leading-tight font-semibold tracking-tight">${title}</h1><p class="text-muted mt-1">${sub}</p></div>
    <div class="flex gap-2">${actions}</div>
  </header>`;

const bubble = (side, text, by) => `
  <div class="flex ${side === 'out' ? 'justify-end' : ''}"><div class="max-w-[80%]">
    ${by === 'mira' ? `<div class="text-[11px] text-muted mb-1 flex justify-end items-center gap-1">${ic('bot', 'w-3 h-3')}Mira</div>` : ''}
    <p class="px-3.5 py-2.5 text-sm leading-relaxed rounded-2xl ${side === 'in' ? 'bg-surface border border-line rounded-bl-md' : by === 'mira' ? 'bg-ai text-ai-ink rounded-br-md' : 'bg-primary text-primary-ink rounded-br-md'}">${text}</p>
  </div></div>`;

const askBox = (ph) => `
  <form data-form="ask" class="bg-surface border border-line rounded-[18px] shadow-card focus-within:border-primary p-3">
    <label class="sr-only" for="ask">Message the assistant</label>
    <textarea id="ask" name="q" rows="2" placeholder="${ph}" class="w-full resize-none bg-transparent outline-none text-[15px] px-1.5 pt-1"></textarea>
    <div class="flex items-center gap-2">
      <button type="button" aria-label="Attach a file" class="w-9 h-9 rounded-ctl text-muted hover:bg-raised inline-flex items-center justify-center">${ic('paperclip')}</button>
      <button type="button" data-act="cycle-branch" class="h-9 px-3 rounded-ctl text-sm text-muted hover:bg-raised inline-flex items-center gap-1.5">${ic('map-pin', 'w-3.5 h-3.5')}${state.branch}${ic('chevrons-up-down', 'w-3.5 h-3.5')}</button>
      <span class="ml-auto hidden sm:inline text-xs text-muted">Enter to send</span>
      <button type="submit" aria-label="Send" class="w-9 h-9 rounded-ctl bg-primary text-primary-ink inline-flex items-center justify-center hover:opacity-90">${ic('arrow-up')}</button>
    </div>
  </form>`;

const liveDot = (tone = 'bg-good') => `<span class="live inline-block w-2 h-2 rounded-full ${tone}"></span>`;

/* ---------------------------------------------------------------- sidebar */
function sidebar() {
  return `
  <aside data-side class="${state.menu ? 'flex fixed inset-y-0 left-0 z-40 shadow-2xl' : 'hidden'} md:flex md:static w-[264px] shrink-0 flex-col bg-side text-side-ink">
    <div class="px-4 pt-4 pb-3 flex items-center gap-2.5"><span class="w-8 h-8 rounded-[10px] bg-ai-strong text-[#3A1E00] inline-flex items-center justify-center">${ic('messages-square', 'w-[58%] h-[58%]')}</span><span class="font-display text-lg font-semibold tracking-tight">Relay</span></div>
    <div class="px-3 flex flex-col gap-2">
      <button data-go="assistant" data-act="new" class="w-full h-10 px-3 rounded-ctl bg-side-ink text-side text-sm font-semibold flex items-center gap-2 hover:opacity-90">${ic('plus')}New request</button>
      <button data-act="palette" class="w-full h-9 px-3 rounded-ctl border border-side-line text-side-muted text-sm flex items-center gap-2 hover:bg-side-active">${ic('search')}<span class="flex-1 text-left">Search or jump to</span><kbd class="px-1.5 rounded border border-side-line text-[11px] font-sans">⌘K</kbd></button>
    </div>
    <nav aria-label="Main" class="px-3 pt-4 flex flex-col gap-0.5">
      ${nav.map(([id, icon, label, count]) => `<button data-go="${id}" aria-current="${state.page === id ? 'page' : 'false'}" class="h-9 px-3 rounded-ctl text-sm flex items-center gap-2.5 ${state.page === id ? 'bg-side-active text-side-ink font-semibold' : 'text-side-muted hover:bg-side-active hover:text-side-ink'}">${ic(icon)}<span class="flex-1 text-left">${label}</span>${count ? `<span class="min-w-5 h-5 px-1.5 rounded-full bg-ai-strong text-[#3A1E00] text-[11px] font-bold inline-flex items-center justify-center">${id === 'inbox' ? inboxCount() : count}</span>` : ''}</button>`).join('')}
    </nav>
    <div class="px-3 pt-5">
      <h2 class="px-3 pb-1.5 text-xs font-semibold text-side-muted">Branches</h2>
      ${['Marina', 'Downtown', 'All branches'].map((b) => `<button data-branch="${b}" aria-pressed="${state.branch === b}" class="w-full h-8 px-3 rounded-ctl text-sm flex items-center gap-2.5 ${state.branch === b ? 'text-side-ink font-semibold' : 'text-side-muted hover:bg-side-active'}"><span class="w-2 h-2 rounded-full ${state.branch === b ? 'bg-ai-strong' : 'bg-side-line'}"></span>${b}</button>`).join('')}
    </div>
    <div class="px-3 pt-5 min-h-0 flex-1 overflow-y-auto thin">
      <h2 class="px-3 pb-1.5 text-xs font-semibold text-side-muted">Recent requests</h2>
      ${recents.map((r) => `<button data-recent="${r}" class="w-full h-8 px-3 rounded-ctl text-sm text-left truncate ${state.page === 'assistant' && state.thread && state.thread.q === r ? 'bg-side-active text-side-ink' : 'text-side-muted hover:bg-side-active hover:text-side-ink'}">${r}</button>`).join('')}
    </div>
    <div class="p-3 border-t border-side-line flex items-center gap-2.5">
      <span class="w-8 h-8 shrink-0 rounded-full bg-side-active text-[11px] font-semibold inline-flex items-center justify-center">PS</span>
      <div class="min-w-0 flex-1"><div class="text-sm font-semibold truncate">Priya Shah</div><div class="text-xs text-side-muted truncate">Lumen Clinics, owner</div></div>
      <button data-act="theme" aria-label="Switch between light and dark" class="w-8 h-8 rounded-ctl text-side-muted hover:bg-side-active inline-flex items-center justify-center">${ic(state.theme === 'dark' ? 'sun' : 'moon')}</button>
    </div>
    <div class="px-3 pb-3 flex gap-1 text-xs text-side-muted"><button data-go="theme" class="px-2 py-1 rounded hover:bg-side-active">Theme</button><button data-go="signin" class="px-2 py-1 rounded hover:bg-side-active">Sign-in screen</button></div>
  </aside>`;
}

const mobileBar = () => `<div class="md:hidden h-12 px-3 flex items-center gap-2 bg-side text-side-ink"><button data-act="menu" aria-label="Open menu" class="w-9 h-9 inline-flex items-center justify-center">${ic('menu', 'w-5 h-5')}</button><span class="font-display font-semibold flex-1">Relay</span><button data-act="palette" aria-label="Search" class="w-9 h-9 inline-flex items-center justify-center">${ic('search', 'w-5 h-5')}</button></div>`;

/* ------------------------------------------------------------------ pages */
const pages = {};

const rightNow = [['Asha Menon', 'choosing a Saturday slot', 'WhatsApp'], ['Website visitor', 'asking about Sunday hours', 'Website'], ['Rahul Verma', 'moving an appointment', 'WhatsApp']];

pages.assistant = () => (state.thread ? assistantThread() : `
  <div class="flex-1 overflow-y-auto thin"><div class="max-w-6xl mx-auto px-5 sm:px-8 py-8 sm:py-12 grid xl:grid-cols-[minmax(0,1fr)_320px] gap-8">
    <div class="flex flex-col gap-7 min-w-0 xl:max-w-2xl xl:justify-self-center xl:w-full">
      <div class="flex flex-col gap-2.5">
        <p class="text-sm text-muted inline-flex items-center gap-2">${liveDot('bg-ai-strong')}Mira is replying to 3 customers right now</p>
        <h1 class="font-display text-[34px] sm:text-[42px] leading-[1.08] font-semibold tracking-tight">Good morning, Priya</h1>
        <p class="text-muted text-[17px]">${state.branch === 'All branches' ? 'Both branches' : state.branch} answered 42 of 47 chats without you. ${state.needs.length ? `${['', 'One thing needs', 'Two things need', 'Three things need'][state.needs.length]} a decision.` : 'Nothing needs you.'}</p>
      </div>
      ${askBox('Ask for a campaign, a report, or a change to how Mira answers')}
      <div class="flex flex-wrap gap-2 -mt-3">
        ${['Offer 10% off cleanings to lapsed patients', 'Why did Mira hand over 5 chats?', 'Show this week’s numbers'].map((q) => `<button data-ask="${q}" class="px-3 py-1.5 rounded-full bg-surface border border-line text-sm text-muted hover:text-ink hover:border-primary">${q}</button>`).join('')}
      </div>
      <section aria-labelledby="needs-h" class="flex flex-col gap-3">
        <div class="flex items-baseline justify-between"><h2 id="needs-h" class="font-semibold">Needs you</h2>${state.needs.length ? `<span class="text-sm text-muted">${state.needs.length} left</span>` : ''}</div>
        ${state.needs.length ? card(`<ul class="divide-y divide-line">${state.needs.map((n) => `
          <li class="p-4 flex items-center gap-3.5"><span class="w-10 h-10 rounded-ctl bg-ai text-ai-ink inline-flex items-center justify-center">${ic(needs[n].icon, 'w-5 h-5')}</span><div class="min-w-0 flex-1"><div class="font-semibold">${needs[n].title}</div><div class="text-sm text-muted">${needs[n].detail}</div></div>${btn(needs[n].action, 'primary', `data-go="${needs[n].go}"`)}<button data-need="${n}" aria-label="Mark as done: ${needs[n].title}" title="Mark as done" class="w-9 h-9 rounded-ctl text-muted hover:bg-good-soft hover:text-good inline-flex items-center justify-center">${ic('check', 'w-5 h-5')}</button></li>`).join('')}</ul>`) : card(`<div class="p-8 flex flex-col items-center text-center gap-2"><span class="w-11 h-11 rounded-full bg-good-soft text-good inline-flex items-center justify-center">${ic('check', 'w-5 h-5')}</span><div class="font-semibold">Nothing needs you</div><p class="text-sm text-muted">Mira has the rest covered. New decisions will show up here.</p></div>`)}
      </section>
    </div>
    <aside aria-label="Right now" class="flex flex-col gap-4">
      ${card(`<div class="p-4"><div class="flex items-center justify-between"><h2 class="font-semibold">Right now</h2><button data-go="inbox" class="text-sm font-semibold text-primary">Open inbox</button></div>
        <ul class="mt-3 flex flex-col gap-3">${rightNow.map(([n, what, ch]) => `<li class="flex items-center gap-3">${avatar(n, 'w-8 h-8 text-[11px]')}<div class="min-w-0 flex-1"><div class="text-sm font-semibold truncate">${n}</div><div class="text-xs text-muted truncate">Mira is ${what}</div></div><span class="text-muted">${ic(chIcon[ch], 'w-3.5 h-3.5')}</span></li>`).join('')}</ul></div>`)}
      ${card(`<div class="p-4"><h2 class="font-semibold">Today</h2><dl class="mt-3 grid grid-cols-2 gap-x-4 gap-y-3">${[['47', 'chats'], ['89%', 'by Mira'], ['9', 'bookings'], ['1m 40s', 'first reply']].map(([n, l]) => `<div><dd class="font-display text-2xl font-semibold tracking-tight">${n}</dd><dt class="text-sm text-muted">${l}</dt></div>`).join('')}</dl><button data-go="insights" class="mt-4 text-sm font-semibold text-primary">See insights</button></div>`)}
      ${card(`<div class="p-4"><h2 class="font-semibold">Branches</h2><ul class="mt-3 flex flex-col gap-2.5 text-sm">${[['Marina', 'All handled', 'good'], ['Downtown', '1 chat waiting 12 min', 'danger']].map(([b, st, tone]) => `<li class="flex items-center justify-between gap-3"><button data-branch="${b}" class="font-medium hover:text-primary">${b}</button>${chip(st, tone)}</li>`).join('')}</ul></div>`)}
    </aside>
  </div></div>`);

const kinds = {
  campaign: { title: 'Winter cleaning offer', icon: 'megaphone', sub: 'Campaign draft, 412 customers', before: 'I found <strong>412 patients</strong> at Marina whose last visit was before 12 May. WhatsApp only allows approved messages for offers, so I reused “Seasonal offer”, which is already approved.', after: 'Mira will handle the replies and book the slots. I’ve capped it at 100 messages a day so the front desk isn’t swamped. Want it to start today at 5:00 pm?', actions: ['Yes, send at 5:00 pm', 'Send me a test first', 'Change the audience'] },
  numbers: { title: 'This week at Marina', icon: 'bar-chart-3', sub: 'Report, last 7 days', before: 'Here’s the week. Chats are up 12%, and Mira answered 87% of them without your team.', after: 'Saturday was the busiest day. Want this sent to you every Monday morning?', actions: ['Yes, every Monday', 'Compare with Downtown'] },
  handover: { title: 'Why Mira handed chats over', icon: 'hand-helping', sub: '38 chats, last 7 days', before: 'Mira handed 38 chats to your team this week. Most were refunds, which she isn’t allowed to decide.', after: 'Eleven were questions she couldn’t answer. I can turn the three most common into answers for you to approve.', actions: ['Show me the three answers', 'Let Mira approve small refunds'] },
};
const kindFor = (t) => (/number|week|report|how did/i.test(t) ? 'numbers' : /hand|why/i.test(t) ? 'handover' : 'campaign');

function artifactBody(kind) {
  if (kind === 'numbers') return `
    <div class="grid grid-cols-2 gap-3">${[['297', 'chats'], ['87%', 'answered by Mira'], ['1m 40s', 'to first reply'], ['61', 'bookings']].map(([n, l]) => `<div class="rounded-card bg-canvas p-3.5"><div class="font-display text-2xl font-semibold tracking-tight">${n}</div><div class="text-sm text-muted">${l}</div></div>`).join('')}</div>

/* ----------------------------------------------------------------- render */
function escapeHtml(t) { return String(t).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

const commands = () => [
  ...nav.map(([id, icon, label]) => ({ icon, label: `Go to ${label}`, run: () => { state.page = id; if (id === 'assistant') state.thread = null; } })),
  { icon: 'plus', label: 'New request', run: () => { state.page = 'assistant'; state.thread = null; } },
  { icon: 'megaphone', label: 'Draft a campaign', run: () => startThread('Offer 10% off cleanings to lapsed patients') },
  { icon: 'bar-chart-3', label: 'Show this week’s numbers', run: () => startThread('Show this week’s numbers') },
  ...['Marina', 'Downtown', 'All branches'].map((b) => ({ icon: 'map-pin', label: `Switch to ${b}`, run: () => { state.branch = b; } })),
  { icon: state.theme === 'dark' ? 'sun' : 'moon', label: `Switch to ${state.theme === 'dark' ? 'light' : 'dark'} mode`, run: toggleTheme },
  { icon: 'palette', label: 'See the theme', run: () => { state.page = 'theme'; } },
];

const palette = () => `
  <div class="fixed inset-0 z-50 flex items-start justify-center pt-[12vh] px-4" role="dialog" aria-modal="true" aria-label="Search or jump to">
    <button data-act="palette" aria-label="Close" class="absolute inset-0 bg-black/40"></button>
    <div class="rise relative w-full max-w-lg bg-surface border border-line rounded-card shadow-2xl overflow-hidden">
      <label class="flex items-center gap-2.5 px-4 h-12 border-b border-line">${ic('search', 'w-4 h-4 text-muted')}<span class="sr-only">Search</span><input id="palette-q" autocomplete="off" placeholder="Search or type a command" class="flex-1 bg-transparent outline-none text-[15px]"></label>
      <ul id="palette-list" class="p-1.5 max-h-80 overflow-y-auto thin text-sm">${commands().map((cmd, n) => `<li><button data-cmd="${n}" class="w-full h-9 px-3 rounded-ctl flex items-center gap-3 text-left hover:bg-raised">${ic(cmd.icon, 'w-4 h-4 text-muted')}<span>${cmd.label}</span></button></li>`).join('')}</ul>
      <p id="palette-empty" class="hidden px-4 py-6 text-sm text-muted text-center">No match. Press Enter to ask the assistant instead.</p>
    </div>
  </div>`;

let toastTimer;
function toast(text) {
  state.toast = text; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { state.toast = ''; const el = document.getElementById('toast'); if (el) el.remove(); }, 2600);
}
function toggleTheme() { state.theme = state.theme === 'dark' ? 'light' : 'dark'; localStorageSet('relay-theme', state.theme); }
function startThread(q, instant) {
  state.page = 'assistant'; state.panel = true; state.menu = false;
  state.thread = { q, kind: kindFor(q), stage: instant ? 'done' : 'thinking' };
  if (!instant) setTimeout(() => { if (state.thread && state.thread.q === q) { state.thread.stage = 'done'; render(); } }, 1100);
}

function render() {
  document.documentElement.dataset.theme = state.theme;
  if (!pages[state.page]) state.page = 'assistant';
  const bare = state.page === 'signin';
  document.getElementById('app').innerHTML = `
    ${bare ? '' : sidebar()}
    ${state.menu ? '<button data-act="menu" aria-label="Close menu" class="md:hidden fixed inset-0 z-30 bg-black/40"></button>' : ''}
    <main class="flex-1 min-w-0 flex flex-col">${bare ? `<div class="h-10 px-4 flex items-center text-sm text-side-muted bg-side"><button data-go="assistant" class="inline-flex items-center gap-1.5 hover:text-side-ink">${ic('arrow-left', 'w-3.5 h-3.5')}Back to the app</button></div>` : mobileBar()}${pages[state.page]()}</main>
    ${state.palette ? palette() : ''}
    ${state.toast ? `<div id="toast" role="status" class="rise fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 h-10 rounded-full bg-ink text-canvas text-sm font-medium inline-flex items-center gap-2 shadow-2xl">${ic('check', 'w-4 h-4')}${escapeHtml(state.toast)}</div>` : ''}`;
  lucide.createIcons();
  history.replaceState(null, '', '#' + state.page);
  const msgs = document.getElementById('msgs'); if (msgs) msgs.scrollTop = msgs.scrollHeight;
  if (state.palette) document.getElementById('palette-q').focus();
  else if (state.pending) { const r = document.getElementById('reply'); if (r) { r.focus(); r.setSelectionRange(r.value.length, r.value.length); } }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-act],[data-branch],[data-customer],[data-agent-tab],[data-ask],[data-recent],[data-chat],[data-need],[data-cmd],[data-toast]');
  if (!t) return;
  const d = t.dataset;
  if (d.go) { state.page = d.go; state.menu = false; if (!d.act && d.go === 'assistant') state.thread = null; }
  if (d.agentTab) state.agentTab = d.agentTab;
  if (d.branch) state.branch = d.branch;
  if (d.customer !== undefined) state.customer = state.customer === Number(d.customer) ? null : Number(d.customer);
  if (d.ask) startThread(d.ask);
  if (d.recent) startThread(d.recent, true);
  if (d.chat) { state.chat = d.chat; state.pending = ''; }
  if (d.need !== undefined) { state.needs = state.needs.filter((n) => n !== Number(d.need)); toast('Marked as done'); }
  if (d.cmd !== undefined) { commands()[Number(d.cmd)].run(); state.palette = false; }
  if (d.toast) toast(d.toast);
  const act = d.act;
  if (act === 'new') state.thread = null;
  if (act === 'panel') state.panel = !state.panel;
  if (act === 'details') state.details = !state.details;
  if (act === 'close-customer') state.customer = null;
  if (act === 'menu') state.menu = !state.menu;
  if (act === 'palette') state.palette = !state.palette;
  if (act === 'theme') toggleTheme();
  if (act === 'cycle-branch') { const b = ['Marina', 'Downtown', 'All branches']; state.branch = b[(b.indexOf(state.branch) + 1) % 3]; }
  if (act === 'send-campaign') { state.sent = !state.sent; toast(state.sent ? 'Scheduled for 5:00 pm today' : 'Sending cancelled'); }
  if (act === 'use-draft') { state.pending = draftText; state.draftUsed = true; }
  if (act === 'take-over') { const c = chats.find((x) => x.name === state.chat) || openChats()[0]; c.who = 'Priya'; state.chat = c.name; toast('You’re replying now. Mira has stopped.'); }
  if (act === 'mark-done') { const c = openChats().find((x) => x.name === state.chat) || openChats()[0]; state.done.push(c.name); state.chat = (openChats()[0] || {}).name; state.pending = ''; toast(`${c.name} marked done`); }
  render();
});

document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'ask') startThread(f.q.value.trim() || 'Offer 10% off cleanings to lapsed patients');
  if (f.dataset.form === 'reply') {
    const text = f.m.value.trim(); if (!text) return;
    const c = openChats().find((x) => x.name === state.chat) || openChats()[0];
    (state.extra[c.name] = state.extra[c.name] || []).push(text);
    c.who = c.who === 'Needs a person' ? 'Priya' : c.who; c.unread = 0; state.chat = c.name; state.pending = ' ';
  }
  render();
  if (state.pending === ' ') { state.pending = ''; const r = document.getElementById('reply'); if (r) { r.value = ''; r.focus(); } }
});

document.addEventListener('input', (e) => {
  if (e.target.id !== 'palette-q') return;
  const q = e.target.value.trim().toLowerCase(); let shown = 0;
  document.querySelectorAll('#palette-list li').forEach((li) => { const hit = li.textContent.toLowerCase().includes(q); li.classList.toggle('hidden', !hit); if (hit) shown += 1; });
  document.getElementById('palette-empty').classList.toggle('hidden', shown > 0);
});

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); state.palette = !state.palette; render(); return; }
  if (e.key === 'Enter' && e.target.id === 'ask' && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); return; }
  if (e.key === 'Enter' && e.target.id === 'palette-q') {
    const first = document.querySelector('#palette-list li:not(.hidden) button');
    if (first) first.click(); else { const q = e.target.value.trim(); state.palette = false; if (q) startThread(q); render(); }
    return;
  }
  if (e.key === 'Enter' && e.target.matches('tr[data-customer], [role="switch"]')) e.target.click();
  if (e.key === 'Escape' && (state.palette || state.menu || state.customer !== null)) { state.palette = false; state.menu = false; state.customer = null; render(); }
});
render();
</script>
</body>
</html>

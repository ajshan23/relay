<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  const v = (n) => `var(--${n})`;
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Figtree', 'system-ui', 'sans-serif'], display: ['"Bricolage Grotesque"', 'Figtree', 'sans-serif'] },
        colors: {
          canvas: v('canvas'), side: v('side'), surface: v('surface'), raised: v('raised'), line: v('line'),
          ink: v('ink'), muted: v('muted'),
          primary: v('primary'), 'primary-ink': v('primary-ink'), 'primary-soft': v('primary-soft'),
          ai: v('ai'), 'ai-ink': v('ai-ink'), 'ai-strong': v('ai-strong'),
          good: v('good'), 'good-soft': v('good-soft'), danger: v('danger'), 'danger-soft': v('danger-soft'),
        },
        borderRadius: { card: '14px', ctl: '10px' },
      },
    },
  };
</script>
<style>
  /* Theme "Tide": cool mist surfaces, petrol for people and actions, apricot for anything the AI did. */
  :root {
    --canvas: #F4F6F7; --side: #EAEEF0; --surface: #FFFFFF; --raised: #EEF2F3; --line: #DCE3E6;
    --ink: #10222B; --muted: #5C6F78;
    --primary: #0F6272; --primary-ink: #FFFFFF; --primary-soft: #DDEEF1;
    --ai: #FFF0DD; --ai-ink: #6B3A05; --ai-strong: #FFB56B;
    --good: #1B7F52; --good-soft: #DCF1E6; --danger: #B4233C; --danger-soft: #FBE3E7;
  }
  :root[data-theme="dark"] {
    --canvas: #0D171C; --side: #0A1317; --surface: #132128; --raised: #1B2D35; --line: #253A43;
    --ink: #E8F0F2; --muted: #8FA3AB;
    --primary: #5CC8D8; --primary-ink: #05252C; --primary-soft: #143842;
    --ai: #33260F; --ai-ink: #FFCF99; --ai-strong: #FFB56B;
    --good: #5FD39A; --good-soft: #123425; --danger: #FF8A9B; --danger-soft: #3D1620;
  }
  body { background: var(--canvas); color: var(--ink); }
  ::placeholder { color: var(--muted); opacity: 1; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
  .thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .thin::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
  @media (prefers-reduced-motion: no-preference) { .panel-in { animation: slide .18s ease-out; } }
  @keyframes slide { from { transform: translateX(16px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body class="font-sans antialiased">
<div id="app" class="h-screen flex overflow-hidden"></div>

<script>
/* ------------------------------------------------------------------ state */
const state = {
  page: (location.hash || '#assistant').slice(1),
  thread: false, panel: true, details: false, customer: null, agentTab: 'Teach', menu: false,
  branch: 'Marina', theme: localStorageGet('relay-theme') || 'light',
};
function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, val) { try { localStorage.setItem(k, val); } catch { /* private mode */ } }

/* ------------------------------------------------------------------- data */
const chats = [
  { name: 'Daniel Okafor', preview: 'I was charged twice for the whitening. Can I get a refund?', time: '4 min', ch: 'Instagram', who: 'Needs a person', unread: 1 },
  { name: 'Asha Menon', preview: 'Saturday 11 works. Do I need to bring my old reports?', time: '2 min', ch: 'WhatsApp', who: 'Mira', unread: 2 },
  { name: 'Rahul Verma', preview: 'Can I move my appointment to Monday?', time: '2 hr', ch: 'WhatsApp', who: 'Mira' },
  { name: 'Website visitor', preview: 'Do you open on Sundays?', time: '1 hr', ch: 'Website', who: 'Mira' },
  { name: 'Fatima Noor', preview: 'You: Your invoice is attached. Thank you for visiting.', time: '32 min', ch: 'WhatsApp', who: 'Priya' },
  { name: 'Leila Haddad', preview: 'Thanks, see you tomorrow.', time: '3 hr', ch: 'WhatsApp', who: 'Sameer' },
  { name: 'Tom Becker', preview: 'How much is a check-up for a child?', time: '5 hr', ch: 'Instagram', who: 'Mira' },
];
const customers = [
  ['Asha Menon', 'Marina', 'WhatsApp', 'Booked', 'Sat 11:00', 'Mira'], ['Daniel Okafor', 'Marina', 'Instagram', 'Talking', 'Refund request', 'Front desk'],
  ['Rahul Verma', 'Marina', 'WhatsApp', 'Booked', 'Mon 10:30', 'Mira'], ['Fatima Noor', 'Downtown', 'WhatsApp', 'Visited', 'Invoice sent', 'Priya'],
  ['Leila Haddad', 'Marina', 'WhatsApp', 'Booked', 'Wed 4:00', 'Sameer'], ['Tom Becker', 'Downtown', 'Instagram', 'New enquiry', 'Asked a price', 'Mira'],
  ['Nora Aziz', 'Marina', 'WhatsApp', 'New enquiry', 'Asked about braces', 'Mira'], ['Omar Said', 'Downtown', 'WhatsApp', 'Booked', 'Thu 9:00', 'Mira'],
  ['Ivy Chen', 'Marina', 'Website', 'Visited', 'Asked for a review', 'Mira'],
];
const needs = [
  { icon: 'hand-helping', title: 'Daniel is asking for a refund', detail: 'Mira stopped and handed the chat to the front desk 4 minutes ago.', action: 'Open chat', go: 'inbox' },
  { icon: 'book-open', title: 'Mira couldn’t answer an insurance question', detail: '“Do you take Aetna?” was asked 3 times this week.', action: 'Teach Mira', go: 'agents' },
  { icon: 'circle-alert', title: 'WhatsApp rejected your reminder message', detail: 'It reads like marketing. A small rewording fixes it.', action: 'Fix message', go: 'campaigns' },
];
const recents = ['Winter cleaning offer', 'Why did Mira hand over 5 chats?', 'Add the Downtown branch', 'Teach Mira the price list', 'Weekly numbers for both branches'];
const nav = [['assistant', 'sparkles', 'Assistant'], ['inbox', 'message-circle', 'Inbox', 3], ['customers', 'users', 'Customers'], ['agents', 'bot', 'Agents'], ['campaigns', 'megaphone', 'Campaigns'], ['insights', 'bar-chart-3', 'Insights']];
const chIcon = { WhatsApp: 'message-circle', Instagram: 'camera', Website: 'globe' };

/* ---------------------------------------------------------------- helpers */
const ic = (n, c = 'w-4 h-4') => `<i data-lucide="${n}" class="${c} shrink-0"></i>`;
const initials = (n) => n.split(' ').map((p) => p[0]).slice(0, 2).join('').toUpperCase();
const avatar = (n, c = 'w-9 h-9 text-xs') => `<span class="${c} shrink-0 rounded-full bg-raised text-ink font-semibold inline-flex items-center justify-center">${initials(n)}</span>`;
const mira = (c = 'w-9 h-9 text-sm') => `<span class="${c} shrink-0 rounded-full bg-ai-strong text-[#4A2600] font-bold inline-flex items-center justify-center" title="Mira, AI agent">M</span>`;
const mark = (c = 'w-8 h-8') => `<span class="${c} shrink-0 rounded-[10px] bg-primary text-primary-ink inline-flex items-center justify-center">${ic('messages-square', 'w-[58%] h-[58%]')}</span>`;
const btn = (label, kind = 'quiet', attrs = '') => {
  const k = { primary: 'bg-primary text-primary-ink hover:opacity-90', quiet: 'bg-raised text-ink hover:bg-line', ghost: 'text-muted hover:bg-raised', line: 'border border-line text-ink hover:bg-raised' }[kind];
  return `<button ${attrs} class="h-9 px-3.5 rounded-ctl text-sm font-semibold whitespace-nowrap inline-flex items-center gap-2 ${k}">${label}</button>`;
};
const chip = (label, tone = 'plain') => {
  const t = { plain: 'bg-raised text-muted', ai: 'bg-ai text-ai-ink', good: 'bg-good-soft text-good', danger: 'bg-danger-soft text-danger', primary: 'bg-primary-soft text-primary' }[tone];
  return `<span class="px-2 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap ${t}">${label}</span>`;
};
const whoChip = (w) => (w === 'Mira' ? chip('Mira', 'ai') : w === 'Needs a person' || w === 'Front desk' ? chip(w, 'danger') : chip(w));
const stageChip = (s) => chip(s, { Booked: 'good', Talking: 'primary', 'New enquiry': 'ai', Visited: 'plain' }[s]);
const card = (inner, extra = '') => `<div class="bg-surface border border-line rounded-card ${extra}">${inner}</div>`;
const pageHead = (title, sub, actions = '') => `
  <header class="px-5 sm:px-8 pt-7 pb-5 flex flex-wrap items-end gap-3">
    <div class="min-w-0 flex-1"><h1 class="font-display text-[28px] leading-tight font-semibold tracking-tight">${title}</h1><p class="text-muted mt-1">${sub}</p></div>
    <div class="flex gap-2">${actions}</div>
  </header>`;

const bubble = (side, text, by) => `
  <div class="flex ${side === 'out' ? 'justify-end' : ''}"><div class="max-w-[80%]">
    ${by === 'mira' ? `<div class="text-[11px] text-muted mb-1 flex justify-end items-center gap-1">${ic('bot', 'w-3 h-3')}Mira</div>` : ''}
    <p class="px-3.5 py-2.5 text-sm leading-relaxed rounded-2xl ${side === 'in' ? 'bg-surface border border-line rounded-bl-md' : by === 'mira' ? 'bg-ai text-ai-ink rounded-br-md' : 'bg-primary text-primary-ink rounded-br-md'}">${text}</p>
  </div></div>`;

const askBox = (ph) => `
  <div class="bg-surface border border-line rounded-[18px] shadow-sm focus-within:border-primary p-3">
    <label class="sr-only" for="ask">Message the assistant</label>
    <textarea id="ask" rows="2" placeholder="${ph}" class="w-full resize-none bg-transparent outline-none text-[15px] px-1.5 pt-1"></textarea>
    <div class="flex items-center gap-2">
      <button aria-label="Attach a file" class="w-9 h-9 rounded-ctl text-muted hover:bg-raised inline-flex items-center justify-center">${ic('paperclip')}</button>
      <button class="h-9 px-3 rounded-ctl text-sm text-muted hover:bg-raised inline-flex items-center gap-1.5">${ic('map-pin', 'w-3.5 h-3.5')}${state.branch}${ic('chevron-down', 'w-3.5 h-3.5')}</button>
      <button data-act="open-thread" aria-label="Send" class="ml-auto w-9 h-9 rounded-ctl bg-primary text-primary-ink inline-flex items-center justify-center">${ic('arrow-up')}</button>
    </div>
  </div>`;

/* ---------------------------------------------------------------- sidebar */
function sidebar() {
  return `
  <aside class="${state.menu ? 'flex fixed inset-y-0 left-0 z-40 shadow-2xl' : 'hidden'} md:flex md:static w-[264px] shrink-0 flex-col bg-side border-r border-line">
    <div class="px-4 pt-4 pb-3 flex items-center gap-2.5">${mark()}<span class="font-display text-lg font-semibold tracking-tight">Relay</span></div>
    <div class="px-3"><button data-go="assistant" data-act="new" class="w-full h-10 px-3 rounded-ctl bg-surface border border-line text-sm font-semibold flex items-center gap-2 hover:border-primary">${ic('plus')}New request</button></div>
    <nav aria-label="Main" class="px-3 pt-3 flex flex-col gap-0.5">
      ${nav.map(([id, icon, label, count]) => `<button data-go="${id}" aria-current="${state.page === id ? 'page' : 'false'}" class="h-9 px-3 rounded-ctl text-sm flex items-center gap-2.5 ${state.page === id ? 'bg-surface font-semibold shadow-sm' : 'text-muted hover:bg-raised hover:text-ink'}">${ic(icon)}<span class="flex-1 text-left">${label}</span>${count ? `<span class="min-w-5 h-5 px-1.5 rounded-full bg-danger-soft text-danger text-[11px] font-bold inline-flex items-center justify-center">${count}</span>` : ''}</button>`).join('')}
    </nav>
    <div class="px-3 pt-5">
      <h2 class="px-3 pb-1.5 text-xs font-semibold text-muted">Branches</h2>
      ${['Marina', 'Downtown', 'All branches'].map((b) => `<button data-branch="${b}" class="w-full h-8 px-3 rounded-ctl text-sm flex items-center gap-2.5 ${state.branch === b ? 'text-ink font-semibold' : 'text-muted hover:bg-raised'}"><span class="w-2 h-2 rounded-full ${state.branch === b ? 'bg-primary' : 'bg-line'}"></span>${b}</button>`).join('')}
    </div>
    <div class="px-3 pt-5 min-h-0 flex-1 overflow-y-auto thin">
      <h2 class="px-3 pb-1.5 text-xs font-semibold text-muted">Recent requests</h2>
      ${recents.map((r, n) => `<button data-go="assistant" data-act="open-thread" class="w-full h-8 px-3 rounded-ctl text-sm text-left truncate ${state.page === 'assistant' && state.thread && n === 0 ? 'bg-raised text-ink' : 'text-muted hover:bg-raised'}">${r}</button>`).join('')}
    </div>
    <div class="p-3 border-t border-line flex items-center gap-2.5">
      ${avatar('Priya Shah', 'w-8 h-8 text-[11px]')}
      <div class="min-w-0 flex-1"><div class="text-sm font-semibold truncate">Priya Shah</div><div class="text-xs text-muted truncate">Lumen Clinics, owner</div></div>
      <button data-act="theme" aria-label="Switch between light and dark" class="w-8 h-8 rounded-ctl text-muted hover:bg-raised inline-flex items-center justify-center">${ic(state.theme === 'dark' ? 'sun' : 'moon')}</button>
    </div>
    <div class="px-3 pb-3 flex gap-1 text-xs text-muted"><button data-go="theme" class="px-2 py-1 rounded hover:bg-raised">Theme</button><button data-go="signin" class="px-2 py-1 rounded hover:bg-raised">Sign-in screen</button></div>
  </aside>`;
}

const mobileBar = () => `<div class="md:hidden h-12 px-3 flex items-center gap-2 border-b border-line bg-side"><button data-act="menu" aria-label="Open menu" class="w-9 h-9 inline-flex items-center justify-center">${ic('menu', 'w-5 h-5')}</button>${mark('w-7 h-7')}<span class="font-display font-semibold">Relay</span></div>`;

/* ------------------------------------------------------------------ pages */
const pages = {};

pages.assistant = () => (state.thread ? assistantThread() : `
  <div class="flex-1 overflow-y-auto thin"><div class="max-w-2xl mx-auto px-5 py-10 sm:py-16 flex flex-col gap-8">
    <div class="flex flex-col gap-2">
      <h1 class="font-display text-[34px] sm:text-[40px] leading-[1.1] font-semibold tracking-tight">Good morning, Priya</h1>
      <p class="text-muted text-[17px]">${state.branch === 'All branches' ? 'Both branches' : state.branch} answered 42 of 47 chats without you. Three things need a decision.</p>
    </div>
    ${askBox('Ask for a campaign, a report, or a change to how Mira answers')}
    <div class="flex flex-wrap gap-2 -mt-3">
      ${['Offer 10% off cleanings to lapsed patients', 'Why did Mira hand over 5 chats?', 'Show this week’s numbers', 'Add opening hours for Sunday'].map((s) => `<button data-act="open-thread" class="px-3 py-1.5 rounded-full bg-surface border border-line text-sm text-muted hover:text-ink hover:border-primary">${s}</button>`).join('')}
    </div>
    <section aria-labelledby="needs-h" class="flex flex-col gap-3">
      <h2 id="needs-h" class="text-sm font-semibold">Needs you</h2>
      ${needs.map((n) => card(`<div class="p-4 flex items-center gap-3.5"><span class="w-10 h-10 rounded-ctl bg-ai text-ai-ink inline-flex items-center justify-center">${ic(n.icon, 'w-5 h-5')}</span><div class="min-w-0 flex-1"><div class="font-semibold">${n.title}</div><div class="text-sm text-muted">${n.detail}</div></div>${btn(n.action, 'line', `data-go="${n.go}"`)}</div>`)).join('')}
    </section>
  </div></div>`);

function assistantThread() {
  const artifactChip = `<button data-act="panel" class="w-full text-left bg-surface border ${state.panel ? 'border-primary' : 'border-line'} rounded-card p-3.5 flex items-center gap-3 hover:border-primary"><span class="w-10 h-10 rounded-ctl bg-primary-soft text-primary inline-flex items-center justify-center">${ic('megaphone', 'w-5 h-5')}</span><span class="flex-1"><span class="block font-semibold">Winter cleaning offer</span><span class="block text-sm text-muted">Campaign draft, 412 customers</span></span>${ic('panel-right-open', 'w-4 h-4 text-muted')}</button>`;
  return `
  <div class="flex-1 min-h-0 flex">
    <div class="flex-1 min-w-0 flex flex-col">
      <div class="h-14 px-5 flex items-center gap-3 border-b border-line"><h1 class="font-semibold truncate">Winter cleaning offer</h1>${chip(state.branch, 'primary')}</div>
      <div class="flex-1 overflow-y-auto thin"><div class="max-w-2xl mx-auto px-5 py-8 flex flex-col gap-6">
        <div class="self-end max-w-[85%] px-4 py-3 rounded-2xl rounded-br-md bg-raised text-[15px] leading-relaxed">Send a 10% cleaning offer to patients who haven’t visited Marina in six months.</div>
        <div class="flex gap-3">${mark('w-8 h-8')}<div class="flex-1 min-w-0 flex flex-col gap-4 text-[15px] leading-relaxed">
          <p>I found <strong>412 patients</strong> at Marina whose last visit was before 12 May. WhatsApp only allows approved messages for offers, so I reused “Seasonal offer”, which is already approved.</p>
          ${artifactChip}
          <p>Mira will handle the replies and book the slots. I’ve capped it at 100 messages a day so the front desk isn’t swamped. Want it to start today at 5:00 pm?</p>
          <div class="flex flex-wrap gap-2">${btn('Yes, send at 5:00 pm', 'primary')}${btn('Send me a test first')}${btn('Change the audience')}</div>
        </div></div>
      </div></div>
      <div class="max-w-2xl w-full mx-auto px-5 pb-5">${askBox('Reply to the assistant')}</div>
    </div>
    ${state.panel ? `
    <aside aria-label="Campaign draft" class="panel-in hidden lg:flex w-[440px] shrink-0 flex-col border-l border-line bg-surface">
      <div class="h-14 px-4 flex items-center gap-2 border-b border-line"><h2 class="font-semibold flex-1">Campaign draft</h2>${chip('Not sent', 'plain')}<button data-act="panel" aria-label="Close panel" class="w-8 h-8 rounded-ctl text-muted hover:bg-raised inline-flex items-center justify-center">${ic('x')}</button></div>
      <div class="flex-1 overflow-y-auto thin p-5 flex flex-col gap-5">
        <div><h3 class="font-display text-xl font-semibold tracking-tight">Winter cleaning offer</h3><p class="text-sm text-muted mt-1">Marina, WhatsApp, starts today 5:00 pm</p></div>
        <div class="rounded-card bg-canvas p-4 flex flex-col gap-2">
          <div class="text-xs text-muted font-semibold">What customers receive</div>
          <div class="self-start max-w-[90%] bg-surface border border-line rounded-2xl rounded-bl-md px-3.5 py-2.5 text-sm leading-relaxed">Hi Asha, it’s been a while. Book a cleaning at Lumen Marina before Sunday and get 10% off.<div class="mt-2.5 pt-2.5 border-t border-line text-primary font-semibold text-center">Book a time</div></div>
        </div>
        <dl class="flex flex-col divide-y divide-line text-sm">
          ${[['Audience', '412 patients, last visit before 12 May'], ['Pace', '100 a day, about 5 days'], ['Replies handled by', 'Mira, then front desk'], ['Estimated cost', 'AED 62 in WhatsApp fees']].map(([k, val]) => `<div class="py-2.5 flex justify-between gap-4"><dt class="text-muted">${k}</dt><dd class="font-medium text-right">${val}</dd></div>`).join('')}
        </dl>
      </div>
      <div class="p-4 border-t border-line flex gap-2">${btn('Send at 5:00 pm', 'primary')}${btn('Edit')}<span class="ml-auto">${btn('Save for later', 'ghost')}</span></div>
    </aside>` : ''}
  </div>`;
}

pages.inbox = () => `
  <div class="flex-1 min-h-0 flex">
    <section aria-label="Chats" class="w-full md:w-[340px] shrink-0 border-r border-line flex flex-col bg-surface">
      <div class="px-4 pt-5 pb-3 flex items-center justify-between"><h1 class="font-display text-2xl font-semibold tracking-tight">Inbox</h1><span class="text-sm text-muted">${state.branch}</span></div>
      <div class="px-4 pb-3 flex gap-1.5 text-sm overflow-x-auto">${[['Needs a person', 2, true], ['Mira', 31], ['Mine', 5], ['All', 38]].map(([t, c, on]) => `<button class="shrink-0 px-3 py-1 rounded-full font-medium ${on ? 'bg-ink text-canvas' : 'bg-raised text-muted'}">${t} <span class="opacity-70">${c}</span></button>`).join('')}</div>
      <div class="flex-1 overflow-y-auto thin px-2 pb-2">${chats.map((c, n) => `
        <button class="w-full flex items-start gap-3 p-2.5 rounded-ctl text-left ${n === 0 ? 'bg-raised' : 'hover:bg-canvas'}">${avatar(c.name)}<span class="min-w-0 flex-1">
          <span class="flex items-baseline justify-between gap-2"><span class="truncate text-sm font-semibold">${c.name}</span><span class="shrink-0 text-xs text-muted">${c.time}</span></span>
          <span class="block truncate text-sm ${c.unread ? '' : 'text-muted'}">${c.preview}</span>
          <span class="mt-1.5 flex items-center justify-between"><span class="inline-flex items-center gap-1 text-xs text-muted">${ic(chIcon[c.ch], 'w-3 h-3')}${c.ch}</span><span class="flex items-center gap-1.5">${whoChip(c.who)}${c.unread ? `<span class="w-5 h-5 rounded-full bg-primary text-primary-ink text-[11px] font-bold inline-flex items-center justify-center">${c.unread}</span>` : ''}</span></span>
        </span></button>`).join('')}</div>
    </section>
    <section aria-label="Chat with Daniel Okafor" class="hidden md:flex flex-1 min-w-0 flex-col">
      <header class="h-16 px-5 flex items-center gap-3 border-b border-line bg-surface">${avatar('Daniel Okafor')}<div class="min-w-0"><h2 class="font-semibold truncate">Daniel Okafor</h2><p class="text-xs text-muted truncate">Instagram. You can reply freely for 23 more hours</p></div><div class="ml-auto flex gap-2">${btn(`${ic('user')}Details`, state.details ? 'quiet' : 'line', 'data-act="details"')}${btn('Mark done', 'primary')}</div></header>
      <div class="flex-1 overflow-y-auto thin p-5 flex flex-col gap-3 max-w-3xl w-full mx-auto">
        ${bubble('in', 'Hi, I had whitening done on Saturday.')}
        ${bubble('out', 'Hi Daniel, thanks for coming in. How can I help?', 'mira')}
        ${bubble('in', 'I was charged twice for the whitening. Can I get a refund?')}
        <p class="text-center text-xs text-muted py-1 inline-flex items-center justify-center gap-1.5 w-full">${ic('hand-helping', 'w-3.5 h-3.5')}Mira handed this chat to the Marina front desk. Refunds need a person.</p>
      </div>
      <div class="px-5 pb-5 max-w-3xl w-full mx-auto flex flex-col gap-2">
        <div class="rounded-card bg-ai text-ai-ink p-3.5 flex items-start gap-3">${mira('w-8 h-8 text-xs')}<div class="flex-1 text-sm"><div class="font-semibold">Mira drafted a reply</div><p class="mt-0.5">Sorry about that, Daniel. I can see two charges of AED 450 on 9 Nov. I’ve refunded one; it reaches your card in 3 to 5 days.</p></div><button class="h-9 px-3 rounded-ctl bg-ai-strong text-[#4A2600] text-sm font-semibold">Use draft</button></div>

          <label class="flex flex-col gap-1.5 text-sm font-medium"><span class="flex justify-between">Password<a href="#signin" class="text-primary font-semibold">Forgot it?</a></span><input type="password" autocomplete="current-password" class="h-11 px-3 rounded-ctl bg-surface border border-line outline-none focus:border-primary font-normal"></label>
        </div>
        <div class="flex flex-col gap-2.5"><button data-go="assistant" class="h-11 rounded-ctl bg-primary text-primary-ink font-semibold">Sign in</button><button class="h-11 rounded-ctl border border-line font-semibold hover:bg-raised">Continue with Google</button></div>
        <p class="text-sm text-muted">New here? <a href="#signin" class="text-primary font-semibold">Create an account</a></p>
      </form>
    </div>
    <div class="hidden lg:flex flex-col justify-center gap-8 p-14 bg-side">
      <h2 class="font-display text-[40px] leading-[1.1] font-semibold tracking-tight max-w-md">Every customer answered. You decide the rest.</h2>
      <div class="max-w-sm flex flex-col gap-3">${bubble('in', 'Hi, can I book a cleaning for Saturday?')}${bubble('out', 'Of course. Marina has 11:00 and 3:30 free. Which suits you?', 'mira')}${bubble('in', '11 please.')}<div class="self-end">${chip('Booked by Mira, 11:00 Saturday', 'good')}</div></div>
      <p class="text-muted max-w-md">WhatsApp, Instagram and your website in one place, for every branch.</p>
    </div>
  </div>`;

/* ----------------------------------------------------------------- render */
function render() {
  document.documentElement.dataset.theme = state.theme;
  if (!pages[state.page]) state.page = 'assistant';
  const bare = state.page === 'signin';
  document.getElementById('app').innerHTML = `
    ${bare ? '' : sidebar()}
    ${state.menu ? '<button data-act="menu" aria-label="Close menu" class="md:hidden fixed inset-0 z-30 bg-black/40"></button>' : ''}
    <main class="flex-1 min-w-0 flex flex-col">${bare ? `<div class="h-10 px-4 flex items-center text-sm text-muted bg-side border-b border-line"><button data-go="assistant" class="inline-flex items-center gap-1.5 hover:text-ink">${ic('arrow-left', 'w-3.5 h-3.5')}Back to the app</button></div>` : mobileBar()}${pages[state.page]()}</main>`;
  lucide.createIcons();
  history.replaceState(null, '', '#' + state.page);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-act],[data-branch],[data-customer],[data-agent-tab]');
  if (!t) return;
  const d = t.dataset;
  if (d.go) { state.page = d.go; state.menu = false; if (!d.act && d.go === 'assistant') state.thread = false; }
  if (d.agentTab) state.agentTab = d.agentTab;
  if (d.branch) state.branch = d.branch;
  if (d.customer !== undefined) state.customer = state.customer === Number(d.customer) ? null : Number(d.customer);
  if (d.act === 'new') state.thread = false;
  if (d.act === 'open-thread') { state.page = 'assistant'; state.thread = true; state.panel = true; }
  if (d.act === 'panel') state.panel = !state.panel;
  if (d.act === 'details') state.details = !state.details;
  if (d.act === 'close-customer') state.customer = null;
  if (d.act === 'menu') state.menu = !state.menu;
  if (d.act === 'theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; localStorageSet('relay-theme', state.theme); }
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('tr[data-customer], [role="switch"]')) e.target.click();
  if (e.key === 'Escape') { state.menu = false; state.customer = null; render(); }
});
render();
</script>
</body>
</html>
